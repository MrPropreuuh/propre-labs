# Example tunnel config. Copy to ~/.cloudflared/propre-labs/config.yml on the Pi.
# docker-compose.yml mounts that directory read-only at /etc/cloudflared.
#
#   cloudflared tunnel login
#   cloudflared tunnel create propre-labs
#   cloudflared tunnel token --cred-file ~/.cloudflared/propre-labs/credentials.json propre-labs
#   cloudflared tunnel route dns propre-labs propre-labs.com

tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/credentials.json   # path as seen from inside the container

ingress:
  # "web" resolves on the internal Docker network: nginx is never published on the host.
  - hostname: propre-labs.com
    service: http://web:80
  - service: http_status:404
